[build]
  command = "cd frontend && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  port = 8888
  functions = "netlify/functions"

# Proxy /threats → Edge Function
[[redirects]]
  from = "/api/threats"
  to = "/.netlify/functions/get-threats"
  status = 200
  force = true