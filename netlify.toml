[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = []

[dev]
  framework = "vite"
  port = 8888
  functions = "netlify/functions"

[[redirects]]
  from = "/api/threats"
  to = "/.netlify/functions/get-threats"
  status = 200
  force = true

[build.environment]
  NETLIFY_EXPERIMENTAL_WARM_LAMBDA = "true"